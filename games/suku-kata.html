<style>

  --card:#FFFFFF; --slot:#EEF3FC;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131D3B; --line:#1F2C55; --margin:#6E3434;
    --ink:#E9EEFF; --ink-soft:#A5B2DA;
    --tile:#FFD23F; --tile-ink:#14203F; --tile-edge:#0B1229;
    --card:#1A2650; --slot:#22305C;
    --ok:#52D89C; --ok-bg:#15392F; --bad:#FF8177; --bad-bg:#41201E;
    --focus:#FFD23F;

  }
}
:root[data-theme="dark"]{
  --paper:#131D3B; --line:#1F2C55; --margin:#6E3434;
  --ink:#E9EEFF; --ink-soft:#A5B2DA;
  --tile:#FFD23F; --tile-ink:#14203F; --tile-edge:#0B1229;
  --card:#1A2650; --slot:#22305C;
  --ok:#52D89C; --ok-bg:#15392F; --bad:#FF8177; --bad-bg:#41201E;
  --focus:#FFD23F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg,transparent 34px,var(--margin) 34px,var(--margin) 36px,transparent 36px),
    repeating-linear-gradient(180deg,transparent 0 39px,var(--line) 39px 40px);
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
main{max-width:620px;margin:0 auto;padding:18px 16px 40px 50px}

/* Header */
.centre{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:15px}
.logo{width:42px;height:42px;border-radius:50%;border:2px dashed var(--ink-soft);display:grid;place-items:center;font-size:11px}
.title{margin:22px 0 4px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.title .t{font-family:"Andika",sans-serif;font-weight:700;font-size:clamp(28px,7vw,40px);background:var(--tile);color:var(--tile-ink);
  border:3px solid var(--tile-edge);border-bottom-width:7px;border-radius:12px;padding:0 12px;line-height:1.35}
.title .t:nth-child(1){transform:rotate(-4deg)}
.title .t:nth-child(2){transform:rotate(3deg)}
.title .t:nth-child(3){transform:rotate(-2deg);margin-left:6px}
.title .t:nth-child(4){transform:rotate(4deg)}
.title .word{font-size:clamp(28px,7vw,40px);font-weight:700;margin-left:8px}
.lede{color:var(--ink-soft);margin:10px 0 28px;font-size:17px;line-height:1.5}

/* Mode choice */
.modes{display:grid;gap:14px}
.mode{display:flex;gap:16px;align-items:center;text-align:left;background:var(--card);border:3px solid var(--ink);
  border-radius:18px;padding:18px;box-shadow:0 6px 0 var(--ink);transition:transform .1s}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.mode .ic{font-size:40px}
.mode b{display:block;font-size:22px}
.mode span{color:var(--ink-soft);font-size:16px}

/* Game bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.ghost{background:transparent;border:2px solid var(--ink-soft);border-radius:999px;padding:6px 14px;font-size:15px;color:var(--ink-soft)}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink-soft)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.miss{background:var(--bad);border-color:var(--bad)}
.dot.now{border-color:var(--ink);background:var(--tile)}
.score{font-weight:600;font-size:18px;white-space:nowrap}

.picture{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:18px;text-align:center;position:relative}
.emoji{font-size:clamp(84px,24vw,120px);line-height:1.1}
.speak-btn{display:none;position:absolute;right:12px;top:12px;align-items:center;gap:6px;background:var(--slot);border:2px solid var(--ink-soft);

.can-speak .speak-btn{display:inline-flex}
.ask{margin:22px 0 12px;font-size:19px;font-weight:600}

.slot{min-width:76px;height:68px;border:3px dashed var(--ink-soft);border-radius:14px;background:var(--slot);

.slots.ok .slot{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.slots.no{animation:shake .45s}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:22px}
.tile{font-family:"Andika",sans-serif;font-weight:700;font-size:32px;min-width:76px;height:68px;padding:0 14px;

.tile:active{transform:translateY(3px);border-bottom-width:4px}
.tile[disabled]{opacity:.18;cursor:default}

.feedback.ok{color:var(--ok)} .feedback.no{color:var(--bad)}
.next{display:block;margin:12px auto 0;background:var(--ink);color:var(--paper);border:none;border-radius:999px;padding:14px 34px;font-size:20px;font-weight:600}

.stars{font-size:62px;letter-spacing:6px}
.stars .off{filter:grayscale(1);opacity:.25}
.result h2{font-size:30px;margin:12px 0 6px}
.result p{color:var(--ink-soft);font-size:18px;margin:0 0 26px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.clue{font-family:"Andika",sans-serif;font-size:20px;line-height:1.45;margin:8px auto 0;max-width:32ch}
.grp{display:flex;gap:8px;flex-wrap:nowrap;justify-content:center;align-items:center}
.hy{font-family:"Andika",sans-serif;font-size:34px;font-weight:700;margin-left:4px}
.menu-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.menu-head h2{margin:0;font-size:24px}
.units h3{font-size:17px;color:var(--ink-soft);margin:24px 0 10px;font-weight:600}
.unit{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);

.unit.all small{color:var(--tile-ink)}

.key{width:100%;font-family:"Andika",sans-serif;font-size:28px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;

.key.bad{border-color:var(--bad);animation:shake .45s}
.gate .next{margin:16px 0 0;width:100%}
.gate .err{color:var(--bad);font-weight:600;min-height:26px;margin-top:12px;font-size:17px}
.gate .hint{color:var(--ink-soft);font-size:15px;line-height:1.5;margin-top:6px}

footer{margin-top:44px;color:var(--ink-soft);font-size:13px;line-height:1.5}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.ck-back{display:block;max-width:620px;margin:0 auto;padding:10px 16px 0 50px;font:600 15px "Fredoka",system-ui,sans-serif;color:var(--ink-soft);text-decoration:none}
.ck-back::before{content:"‹ "}
.hint a{color:var(--ink);font-weight:700}

function parseWord(e){
  const parts = e[0].split(/([ -])/);
  const groups = parts.filter((_,i)=>i%2===0).map(x=>x.split("."));
  const seps = parts.filter((_,i)=>i%2===1);
  let w = ""; groups.forEach((g,i)=>{ w += g.join("") + (seps[i]||""); });
  return { w, groups, seps, syl: groups.flat(), emoji: e[1], clue: e[2] || "" };
}

async function sha256(t){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function checkKey(code){
  const n = code.toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(n.length < 8) return null;
  const h = await sha256(KEY_SALT + n);
  return (KEY_HASHES.has(h)?h:(window.jmPass?await jmPass.check(code):null));
}
function gate(){
  app.innerHTML = `
    <h1 class="title" aria-label="JoMain Suku Kata"><span class="t">Su</span><span class="t">ku</span><span class="t">Ka</span><span class="t">ta</span><span class="word">JoMain</span></h1>
    <div class="gate">
      <p class="lede">Masukkan kod akses untuk membuka permainan. Kod ini diberikan selepas pembayaran dan hanya perlu dimasukkan sekali pada setiap peranti.</p>
      <label for="key">Kod akses</label>
      <input id="key" class="key" placeholder="SKC-XXXX-XXXX" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="next" id="unlock">Buka permainan</button>
      <div class="err" id="err" aria-live="polite"></div>
      <p class="hint">Tiada kod? <a href='https://wa.me/601163927569?text=Salam%2C%20saya%20nak%20beli%20JoMain%20Suku%20Kata.' target='_blank' rel='noopener'>WhatsApp untuk beli</a>.</p>
    </div>`;
  const inp = document.getElementById("key"), err = document.getElementById("err"), btn = document.getElementById("unlock");
  async function go(){
    err.textContent = ""; inp.classList.remove("bad");
    if(!(window.crypto && crypto.subtle)){ err.textContent = "Pelayar ini tidak menyokong semakan kod. Cuba buka dengan Chrome atau Safari."; return; }
    btn.disabled = true;
    const h = await checkKey(inp.value);
    btn.disabled = false;
    if(h){ try{ localStorage.setItem("skc-key", h); }catch(e){} tone([523,659,784]); home(); }
    else { void inp.offsetWidth; inp.classList.add("bad"); err.textContent = "Kod tidak sah. Semak semula ejaan kod anda."; tone([220,185]); }
  }
  btn.addEventListener("click", go);
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });
  inp.focus();
}
function boot(){
  let saved = null;
  try{ saved = localStorage.getItem("skc-key"); }catch(e){}
  if(saved && (KEY_HASHES.has(saved)||(window.jmPass&&jmPass.valid(saved)))) home(); else gate();
}

const app = document.getElementById("app");
let S = {};
let sound = true;
try { sound = localStorage.getItem("skc-sound") !== "off"; } catch(e) {}

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ===== Bunyi ===== */
let ac;
function tone(freqs){
  if(!sound) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime;
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain(), s=t+i*0.12;
      o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.22,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+0.26);
      o.connect(g).connect(ac.destination); o.start(s); o.stop(s+0.3);
    });
  }catch(e){}
}
let voice = null;
function loadVoices(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null;
  document.body.classList.toggle("can-speak", !!voice);
}
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text){
  if(!sound || !voice) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.voice=voice; u.lang=voice.lang; u.rate=0.8; speechSynthesis.speak(u); }catch(e){}
}

/* ===== Ejaan salah untuk mod 2 ===== */
function misspell(w){
  const c = new Set(), sw = {a:"e",e:"i",i:"e",o:"u",u:"o"};
  for(let k=0;k<w.length;k++){ if(sw[w[k]]) c.add(w.slice(0,k)+sw[w[k]]+w.slice(k+1)); }
  if(w.endsWith("h")) c.add(w.slice(0,-1));
  if(w.includes("-")) c.add(w.replace("-"," "));
  [["ng","n"],["c","s"],["kh","k"],["ny","n"],["sy","s"]].forEach(([x,y])=>{ if(w.includes(x)) c.add(w.replace(x,y)); });
  c.delete(w);
  let out = shuffle([...c]).slice(0,2);
  for(let k=1;out.length<2 && k<w.length;k++){
    if(/[bdfgjklmnprst]/.test(w[k])){ const v=w.slice(0,k)+w[k]+w.slice(k); if(v!==w && !out.includes(v)) out.push(v); }
  }
  return out;
}

/* ===== Skrin utama ===== */
function home(){
  app.innerHTML = `
    <div class="centre"><div class="logo">${CENTRE.logoText}</div><div>${CENTRE.name}</div></div>
    <h1 class="title" aria-label="JoMain Suku Kata"><span class="t">Su</span><span class="t">ku</span><span class="t">Ka</span><span class="t">ta</span><span class="word">JoMain</span></h1>
    <p class="lede">Permainan membaca untuk murid Tahap 1, mengikut unit buku teks. Pilih permainan, kemudian pilih unit.</p>
    <div class="modes">
      <button class="mode" data-act="mode" data-mode="build"><span class="ic">🧩</span><span><b>Bina perkataan</b><span>Susun suku kata mengikut gambar dan petunjuk.</span></span></button>
      <button class="mode" data-act="mode" data-mode="spell"><span class="ic">✏️</span><span><b>Pilih ejaan betul</b><span>Cari perkataan yang dieja dengan tepat.</span></span></button>
    </div>
    <footer>${ALL.length} perkataan dalam ${UNITS.length} kumpulan. Logo, nama pusat dan senarai perkataan boleh disesuaikan.</footer>`;
}

function unitMenu(){
  const title = S.mode==="build" ? "Bina perkataan" : "Pilih ejaan betul";
  let html = "", lastTema = "";
  UNITS.forEach(u=>{
    if(u.tema!==lastTema){ html += `<h3>${u.tema}</h3>`; lastTema = u.tema; }
    html += `<button class="unit" data-act="start" data-unit="${u.id}">${u.name}<small>${u.items.length} perkataan</small></button>`;
  });
  app.innerHTML = `
    <div class="menu-head"><button class="ghost" data-act="home">Kembali</button><h2>${title}</h2></div>
    <div class="units">
      <button class="unit all" data-act="start" data-unit="all">Semua unit, campur<small>${ALL.length} perkataan</small></button>
      ${html}
    </div>`;
}

function start(unitId){
  const pool = unitId==="all" ? ALL : UNITS.find(u=>u.id===unitId).items;
  const rounds = shuffle(pool).slice(0,ROUNDS).sort((x,y)=>x.syl.length-y.syl.length);
  S = { mode:S.mode, unit:unitId, rounds, i:0, score:0, marks:[] };
  round();
}

function bar(){
  const n = S.rounds.length;
  const dots = S.rounds.map((_,k)=>`<span class="dot ${k<S.i?(S.marks[k]?"done":"miss"):k===S.i?"now":""}"></span>`).join("");
  return `<div class="bar">
    <button class="ghost" data-act="units">Keluar</button>
    <div class="dots" aria-label="Soalan ${S.i+1} daripada ${n}">${dots}</div>
    <div class="score">⭐ ${S.score} <button class="ghost" data-act="sound" aria-label="${sound?"Matikan bunyi":"Hidupkan bunyi"}" style="margin-left:6px;padding:4px 10px">${sound?"🔊":"🔇"}</button></div>
  </div>`;
}

function round(){
  const r = S.rounds[S.i];
  S.first = true; S.solved = false;
  if(S.mode==="build"){
    const unitPool = S.unit==="all" ? ALL : UNITS.find(u=>u.id===S.unit).items;
    let pool = [...new Set(unitPool.flatMap(x=>x.syl))].filter(t=>!r.syl.includes(t));
    if(pool.length<2) pool = [...new Set(ALL.flatMap(x=>x.syl))].filter(t=>!r.syl.includes(t));
    const extra = shuffle(pool).slice(0,2);
    S.tiles = shuffle([...r.syl,...extra]).map((t,k)=>({t,id:k,used:false}));
    S.filled = Array(r.syl.length).fill(null);
  } else {
    S.opts = shuffle([r.w,...misspell(r.w)]);
    S.wrong = [];
  }
  draw();
}

function draw(fb=""){
  const r = S.rounds[S.i];
  let body = "";
  if(S.mode==="build"){
    let idx = 0;
    const slots = r.groups.map((g,gi)=>`<span class="grp">${g.map(()=>{
      const k = idx++, id = S.filled[k], t = id===null ? "" : S.tiles[id].t;
      return `<button class="slot ${id!==null?"full":""}" data-act="unslot" data-k="${k}" ${S.solved?"disabled":""} aria-label="Petak ${k+1}${t?": "+t:" kosong"}">${t}</button>`;
    }).join("")}${r.seps[gi]==="-"?'<span class="hy">-</span>':""}</span>`).join("");
    const tiles = S.tiles.map(x=>`<button class="tile" data-act="tile" data-id="${x.id}" ${x.used||S.solved?"disabled":""}>${x.t}</button>`).join("");
    const nw = r.seps.filter(x=>x===" ").length+1;
    const hint = nw>1 ? ` (${nw} patah perkataan)` : r.seps.includes("-") ? " (kata ganda)" : "";
    body = `<p class="ask">Susun suku kata untuk gambar ini${hint}.</p>
      <div class="slots ${S.solved?"ok":""}" id="slots">${slots}</div>
      <div class="tiles">${tiles}</div>`;
  } else {
    const opts = S.opts.map(o=>{
      const cls = S.solved && o===r.w ? "ok" : S.wrong.includes(o) ? "no" : "";
      return `<button class="opt ${cls}" data-act="opt" data-v="${o}" ${S.solved||S.wrong.includes(o)?"disabled":""}>${o}</button>`;
    }).join("");
    body = `<p class="ask">Mana ejaan yang betul?</p><div class="opts">${opts}</div>`;
  }
  const last = S.i===S.rounds.length-1;
  app.innerHTML = bar() + `
    <div class="picture"><div class="emoji" role="img" aria-label="Gambar">${r.emoji}</div>
      ${r.clue?`<p class="clue">${r.clue}</p>`:""}
      <button class="speak-btn" data-act="say">🔈 Dengar</button></div>
    ${body}
    <div class="feedback ${fb.startsWith("Betul")?"ok":fb?"no":""}" aria-live="polite">${fb}</div>
    ${S.solved?`<button class="next" data-act="next">${last?"Lihat keputusan":"Seterusnya"}</button>`:""}`;
  if(S.solved){ const n=app.querySelector(".next"); n && n.focus(); }
}

function win(){
  const r = S.rounds[S.i];
  S.solved = true;
  S.marks[S.i] = S.first;
  if(S.first) S.score++;
  tone([523,659,784]);
  speak(r.w);
  const msg = S.first ? ["Betul! Hebat! 🎉","Betul! Bagus sekali! 🌟","Betul! Teruskan! 💪"][Math.floor(Math.random()*3)] : `Betul! Jawapannya "${r.w}". 👍`;
  draw(msg);
}

function result(){
  const n = S.rounds.length, s = S.score, pct = s/n;
  const stars = pct>=0.9?3:pct>=0.6?2:1;
  const msg = stars===3 ? "Cemerlang! Kamu pandai membaca." : stars===2 ? "Bagus! Sedikit lagi untuk tiga bintang." : "Jangan putus asa. Cuba sekali lagi!";
  app.innerHTML = `<div class="result">
    <div class="stars" aria-label="${stars} bintang">${[1,2,3].map(k=>`<span class="${k<=stars?"":"off"}">⭐</span>`).join("")}</div>
    <h2>Markah: ${s} / ${n}</h2><p>${msg}</p>
    <div class="row"><button class="next" data-act="again" style="margin:0">Main lagi</button>
    <button class="ghost" data-act="units" style="font-size:18px;padding:12px 22px">Pilih unit lain</button></div></div>`;
  tone(stars===3?[523,659,784,1047]:[523,659]);
}

/* ===== Interaksi ===== */
app.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;
  if(act==="mode"){ S = { mode:b.dataset.mode }; return unitMenu(); }
  if(act==="units") return unitMenu();
  if(act==="start") return start(b.dataset.unit);
  if(act==="home") return home();
  if(act==="again") return start(S.unit);
  if(act==="sound"){ sound=!sound; try{localStorage.setItem("skc-sound",sound?"on":"off")}catch(err){} if(!sound&&"speechSynthesis" in window) speechSynthesis.cancel(); return draw(); }
  if(act==="say") return speak(S.rounds[S.i].w);
  if(act==="next"){ S.i++; return S.i>=S.rounds.length ? result() : round(); }

  if(act==="tile"){
    const x = S.tiles[+b.dataset.id], k = S.filled.indexOf(null);
    if(x.used || k<0) return;
    x.used = true; S.filled[k] = x.id; speak(x.t);
    if(!S.filled.includes(null)){
      const built = S.filled.map(id=>S.tiles[id].t);
      if(built.every((t,j)=>t===S.rounds[S.i].syl[j])) return win();
      S.first = false; tone([220,185]); draw("Belum tepat. Cuba lagi!");
      const sl = document.getElementById("slots"); sl && sl.classList.add("no");
      setTimeout(()=>{ S.filled.forEach(id=>{ if(id!==null) S.tiles[id].used=false; }); S.filled=S.filled.map(()=>null); draw("Belum tepat. Cuba lagi!"); },650);
      return;
    }
    return draw();
  }
  if(act==="unslot"){
    const k=+b.dataset.k, id=S.filled[k]; if(id===null) return;
    S.tiles[id].used=false; S.filled[k]=null; return draw();
  }
  if(act==="opt"){
    const v=b.dataset.v;
    if(v===S.rounds[S.i].w) return win();
    S.first=false; S.wrong.push(v); tone([220,185]); draw("Bukan itu. Cuba lagi!");
  }
});

boot();
</script>
</body>
