/* title + menu */

.logo{width:42px;height:42px;border-radius:50%;border:2px dashed var(--ink-soft);display:grid;place-items:center;font-size:11px}
.title{margin:18px 0 4px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.title .t{font-family:"Andika",sans-serif;font-weight:700;font-size:clamp(28px,7vw,40px);background:var(--tile);color:var(--tile-ink);border:3px solid var(--tile-edge);border-bottom-width:7px;border-radius:12px;padding:0 12px;line-height:1.35}
.title .t:nth-child(odd){transform:rotate(-4deg)} .title .t:nth-child(even){transform:rotate(3deg)}
.title .word{font-size:clamp(26px,6.5vw,38px);font-weight:700;margin-left:6px;line-height:1.1}
.lede{color:var(--ink-soft);margin:8px 0 22px;font-size:17px;line-height:1.5;font-family:"Andika",sans-serif}
.gcard{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);margin-bottom:22px;overflow:hidden}
.gcard .art{height:130px;display:flex;align-items:flex-end;justify-content:center;gap:6px;overflow:hidden}
.gcard.gm .art{background:linear-gradient(var(--sky2),var(--sky2) 55%,var(--grass) 55%)}
.gcard.gb .art{background:linear-gradient(var(--sky1),var(--sky2));align-items:center}

.levels{display:flex;gap:10px;flex-wrap:wrap}

.lvl small{display:block;font-weight:500;font-size:13px;opacity:.8}
footer{margin-top:20px;color:var(--ink-soft);font-size:13px}

/* gate */
.gate{max-width:440px}
.gate label{display:block;font-weight:600;font-size:19px;margin:6px 0 10px}
.key{width:100%;font-family:"Andika",sans-serif;font-size:28px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:12px;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}
.key.bad{border-color:var(--bad);animation:shake .45s}
.btn{display:block;width:100%;margin-top:14px;background:var(--ink);color:var(--paper);border:none;border-radius:999px;padding:14px;font-size:20px;font-weight:600}
.err{color:var(--bad);font-weight:600;min-height:26px;margin-top:12px}
.hint{color:var(--ink-soft);font-size:15px}

.ghost{background:transparent;border:2px solid var(--ink-soft);border-radius:999px;padding:5px 12px;font-size:15px;color:var(--ink-soft)}
.timer{flex:1;height:14px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}

.hearts{font-size:18px;letter-spacing:1px;white-space:nowrap}
.sc{font-weight:700;font-size:20px;white-space:nowrap;min-width:64px;text-align:right}
.combo{height:22px;text-align:center;font-weight:700;color:var(--ok);font-size:17px}

.cell{position:relative;aspect-ratio:1/1.32}
.pit{position:absolute;left:4%;right:4%;top:0;bottom:12%;overflow:hidden}

.mole svg{width:100%;height:auto;display:block}

.mole.hit .x{display:inline} .mole.hit .o{display:none}

.mole.wrong{animation:wobble .4s}
.lip{position:absolute;left:0;right:0;bottom:4%;height:15%;background:var(--grass-dark);border-radius:50%;z-index:2;pointer-events:none}
.hammer{position:absolute;font-size:46px;pointer-events:none;z-index:5;transform-origin:80% 80%;animation:swing .25s ease-out forwards}
.float{position:absolute;z-index:6;font-weight:700;font-size:24px;color:var(--ok);pointer-events:none;animation:rise .7s ease-out forwards;text-shadow:0 2px 0 #fff}
.float.no{color:var(--bad)}

@keyframes wobble{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(0) rotate(-10deg)}75%{transform:translateY(0) rotate(10deg)}}
@keyframes swing{0%{transform:rotate(-50deg)}60%{transform:rotate(15deg)}100%{transform:rotate(0);opacity:0}}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-50px);opacity:0}}

.bal.pop{animation:pop .25s ease-out forwards}
.bal.shake svg{animation:wobble .4s}
.bit{position:absolute;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:4;animation:bit .6s ease-out forwards}
@keyframes pop{to{transform:var(--t) scale(1.6);opacity:0}}
@keyframes bit{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}

/* overlay */
.ov{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:rgba(15,25,60,.45);padding:20px}
.count{font-size:110px;font-weight:700;color:#fff;text-shadow:0 6px 0 #1F3A93;animation:popin .5s ease-out}

.end p{color:var(--ink-soft);margin:4px 0 14px}
.end .row{display:flex;gap:10px}
.end .row button{flex:1}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.ck-back{display:block;max-width:620px;margin:0 auto;padding:10px 16px 0 50px;font:600 15px "Fredoka",system-ui,sans-serif;color:var(--ink-soft);text-decoration:none}

.hint a{color:var(--ink);font-weight:700}

}

/* ===== Lukisan ===== */
function moleSVG(n){ return `<svg viewBox="0 0 100 124" aria-hidden="true">
  <rect x="16" y="3" width="68" height="36" rx="8" fill="#FFFFFF" stroke="#1F3A93" stroke-width="4"/>
  <text x="50" y="31" text-anchor="middle" font-family="Andika,sans-serif" font-weight="700" font-size="28" fill="#1F3A93">${n}</text>
  <ellipse cx="50" cy="96" rx="36" ry="40" fill="#8B5A3C"/>
  <circle cx="20" cy="42" r="8" fill="#8B5A3C"/><circle cx="80" cy="42" r="8" fill="#8B5A3C"/>
  <ellipse cx="50" cy="86" rx="24" ry="21" fill="#D9AE85"/>
  <g class="o"><circle cx="39" cy="74" r="5" fill="#1B1B1B"/><circle cx="61" cy="74" r="5" fill="#1B1B1B"/><circle cx="40.5" cy="72.5" r="1.6" fill="#fff"/><circle cx="62.5" cy="72.5" r="1.6" fill="#fff"/></g>
  <g class="x" stroke="#1B1B1B" stroke-width="3" stroke-linecap="round"><path d="M35 70 L43 78 M43 70 L35 78 M57 70 L65 78 M65 70 L57 78"/></g>
  <circle cx="31" cy="86" r="4" fill="#F4A3A8" opacity=".8"/><circle cx="69" cy="86" r="4" fill="#F4A3A8" opacity=".8"/>
  <ellipse cx="50" cy="84" rx="7" ry="5" fill="#E85D8A"/>
  <rect x="45" y="90" width="10" height="8" rx="2" fill="#fff" stroke="#C9B8A6"/></svg>`; }
const BCOL=["#E53935","#1E63D6","#2E9E5B","#F28C28","#8E44AD","#EC6FA0","#00A3A3"];
function balloonSVG(n,col){ return `<svg viewBox="0 0 60 96" aria-hidden="true">
  <path d="M30 64 Q23 76 31 86 Q36 92 30 96" stroke="#7B8496" stroke-width="2" fill="none"/>
  <path d="M26 60 L34 60 L30 66 Z" fill="${col}"/>
  <ellipse cx="30" cy="31" rx="27" ry="31" fill="${col}"/>
  <ellipse cx="20" cy="18" rx="6" ry="10" fill="#fff" opacity=".45" transform="rotate(-20 20 18)"/>
  <text class="num" x="30" y="41" text-anchor="middle" font-family="Andika,sans-serif" font-weight="700" font-size="27" fill="#fff" stroke="#14203F" stroke-width="3" paint-order="stroke">${n}</text></svg>`; }

/* ===== Menu ===== */
function best(k){ return +(ls.get("ark-best-"+k)||0); }
function home(){
  stopGame(); app.className="";
  app.innerHTML=`<div class="centre"><div class="logo">LOGO</div><div>${C.centre}</div></div>${TITLE}
  <p class="lede">Permainan arked untuk berlatih tambah. Setiap pusingan 1 minit. Kumpul skor tertinggi!</p>
  <div class="gcard gm"><div class="art">${moleSVG(7)}${moleSVG(5)}</div><div class="body">
    <h2>Ketuk Tikus Mondok</h2><p>Ketuk tikus mondok yang memegang jawapan betul sebelum ia menyorok.</p>
    <div class="levels"><button class="lvl" data-act="mole" data-l="10">Tambah hingga 10<small>Skor terbaik: ${best("mole10")}</small></button>
    <button class="lvl" data-act="mole" data-l="20">Tambah hingga 20<small>Skor terbaik: ${best("mole20")}</small></button></div></div></div>
  <div class="gcard gb"><div class="art">${balloonSVG(7,BCOL[0])}${balloonSVG(3,BCOL[1])}${balloonSVG(6,BCOL[2])}${balloonSVG(4,BCOL[3])}</div><div class="body">
    <h2>Pecah Belon</h2><p>Pilih dua belon yang jumlahnya sama dengan nombor sasaran.</p>
    <div class="levels"><button class="lvl" data-act="bal" data-l="10">Jumlah 10<small>Skor terbaik: ${best("bal10")}</small></button>
    <button class="lvl" data-act="bal" data-l="20">Jumlah 20<small>Skor terbaik: ${best("bal20")}</small></button></div></div></div>
  <footer>Logo dan nama pusat boleh disesuaikan.</footer>`;
}
app.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  if(a==="mole") return startMole(+b.dataset.l); if(a==="bal") return startBal(+b.dataset.l);
  if(a==="quit"||a==="menu") return home(); if(a==="again") return G.mode==="mole"?startMole(G.level):startBal(G.level);
  if(a==="sound"){ sound=!sound; ls.set("ark-sound",sound?"on":"off"); b.textContent=sound?"🔊":"🔇"; } });

/* ===== Kawalan permainan ===== */
let G={}, timers=[], raf=0;
function later(f,ms){ const t=setTimeout(f,ms); timers.push(t); return t; }
function stopGame(){ G.running=false; timers.forEach(clearTimeout); timers=[]; cancelAnimationFrame(raf); clearInterval(G.clock); document.querySelectorAll(".ov").forEach(o=>o.remove()); }
document.addEventListener("visibilitychange",()=>{ G.paused=document.hidden; });
function hud(){ return `<div class="hud"><button class="ghost" data-act="quit">Keluar</button><div class="timer"><span id="tbar"></span></div>
  <div class="hearts" id="hearts">❤️❤️❤️</div><button class="ghost" data-act="sound" aria-label="Bunyi">${sound?"🔊":"🔇"}</button><div class="sc">⭐ <span id="score">0</span></div></div><div class="combo" id="combo"></div>`; }
function setHud(){ document.getElementById("score").textContent=G.score; document.getElementById("hearts").textContent="❤️".repeat(G.hearts)+"🤍".repeat(3-G.hearts);
  document.getElementById("combo").textContent=G.combo>=3?`Kombo x${1+Math.floor(G.combo/3)}! 🔥`:""; }
function countdown(then){ const ov=document.createElement("div"); ov.className="ov"; document.body.appendChild(ov); let n=3;
  const step=()=>{ if(n>0){ ov.innerHTML=`<div class="count">${n}</div>`; SFX.tick(); n--; later(step,650); } else { ov.innerHTML=`<div class="count">Mula!</div>`; SFX.go(); later(()=>{ ov.remove(); then(); },500); } };
  step(); }
function runClock(){ G.left=60; const bar=document.getElementById("tbar"); G.clock=setInterval(()=>{ if(G.paused||!G.running) return; G.left-=.1;
  bar.style.transform=`scaleX(${Math.max(0,G.left/60)})`; if(G.left<=0) endGame("Masa tamat!"); },100); }
function addPoints(x,y,host){ const mult=1+Math.floor(G.combo/3), pts=10*mult; G.score+=pts; G.combo++; floatText(`+${pts}`,x,y,host,false); setHud(); }
function floatText(t,x,y,host,bad){ const f=document.createElement("div"); f.className="float"+(bad?" no":""); f.textContent=t; f.style.left=x+"px"; f.style.top=y+"px"; host.appendChild(f); later(()=>f.remove(),800); }
function loseHeart(){ G.hearts--; G.combo=0; setHud(); if(G.hearts<=0) later(()=>endGame("Nyawa habis!"),350); }
function endGame(why){
  if(!G.running) return; G.running=false; clearInterval(G.clock); timers.forEach(clearTimeout); timers=[]; cancelAnimationFrame(raf);
  const key=G.mode+G.level, old=best(key), rec=G.score>old; if(rec) ls.set("ark-best-"+key,G.score);
  const st=G.score>=200?3:G.score>=100?2:G.score>0?1:0; SFX.end();
  const ov=document.createElement("div"); ov.className="ov"; ov.innerHTML=`<div class="end"><h2>${why}</h2>
    <div class="stars">${[1,2,3].map(k=>`<span class="${k<=st?"":"off"}">⭐</span>`).join("")}</div>
    ${rec&&G.score>0?`<div class="rec">Rekod baru! 🏆</div>`:""}<div class="big">${G.score}</div>
    <p>${rec?"Hebat! Skor tertinggi kamu.":`Skor terbaik: ${Math.max(old,G.score)}`}</p>
    <div class="row"><button class="btn" data-act="again" style="margin:0">Main lagi</button><button class="btn" data-act="menu" style="margin:0;background:transparent;color:var(--ink);border:2px solid var(--ink)">Menu</button></div></div>`;
  ov.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return; ov.remove(); b.dataset.act==="again"?(G.mode==="mole"?startMole(G.level):startBal(G.level)):home(); });
  document.body.appendChild(ov);
}

/* ===== KETUK TIKUS MONDOK ===== */
function newSum(L){ let a,b; if(L===10){ a=rnd(1,9); b=rnd(1,10-a); } else { a=rnd(2,15); b=rnd(Math.max(1,8-a),Math.min(18,20-a)); } return {a,b,ans:a+b}; }
function startMole(L){
  stopGame(); app.className="play";
  app.innerHTML=hud()+`<div class="qcard"><div class="eq" id="eq">? + ? = <b>?</b></div></div>
    <div class="field" id="field">${Array.from({length:9},(_,i)=>`<div class="cell"><div class="pit"><div class="mole" data-i="${i}" id="m${i}"></div></div><div class="lip"></div></div>`).join("")}</div>`;
  G={mode:"mole",level:L,score:0,hearts:3,combo:0,hits:0,running:false}; setHud();
  const field=document.getElementById("field");
  field.addEventListener("pointerdown",e=>{ if(!G.running) return; const r=field.getBoundingClientRect(); const h=document.createElement("div"); h.className="hammer"; h.textContent="🔨";
    h.style.left=(e.clientX-r.left-28)+"px"; h.style.top=(e.clientY-r.top-40)+"px"; field.appendChild(h); later(()=>h.remove(),280);
    const m=e.target.closest(".mole"); if(m) whack(+m.dataset.i, e.clientX-r.left, e.clientY-r.top); });
  countdown(()=>{ G.running=true; runClock(); nextQ(); });
}
function nextQ(){ G.q=newSum(G.level); document.getElementById("eq").innerHTML=`${G.q.a} + ${G.q.b} = <b>?</b>`; wave(); }
function wave(){
  if(!G.running) return;
  const {ans}=G.q, max=G.level===10?10:20, wrong=new Set();
  shuffle([ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,G.q.a,G.q.b].filter(v=>v>=0&&v<=max+2&&v!==ans)).forEach(v=>{ if(wrong.size<2) wrong.add(v); });
  while(wrong.size<2){ const v=rnd(0,max); if(v!==ans) wrong.add(v); }
  const holes=shuffle([...Array(9).keys()]).slice(0,3), vals=shuffle([ans,...wrong]);
  G.up={}; holes.forEach((h,i)=>{ const m=document.getElementById("m"+h); m.className="mole"; m.innerHTML=moleSVG(vals[i]); G.up[h]=vals[i]; later(()=>m.classList.add("up"),i*90); });
  G.locked=false; const stay=Math.max(1500,3000-G.hits*90);
  G.waveT=later(()=>{ if(!G.running||G.locked) return; hideAll(); G.combo=0; setHud(); later(wave,380); },stay);
}
function hideAll(){ document.querySelectorAll(".mole").forEach(m=>{ if(!m.classList.contains("hit")) m.classList.remove("up"); }); }
function whack(i,x,y){
  if(!G.running||G.locked||!(i in G.up)) return; const m=document.getElementById("m"+i); if(!m.classList.contains("up")) return;
  const field=document.getElementById("field");
  if(G.up[i]===G.q.ans){ G.locked=true; clearTimeout(G.waveT); G.hits++; SFX.bonk(); later(SFX.good,90); m.classList.add("hit"); addPoints(x-14,y-30,field);
    hideAll(); later(()=>{ m.className="mole"; nextQ(); },520); }
  else { SFX.bad(); m.classList.add("wrong"); floatText("✗",x-6,y-30,field,true); delete G.up[i]; later(()=>m.classList.remove("up","wrong"),420); loseHeart(); }
}

/* ===== PECAH BELON ===== */
function startBal(T){
  stopGame(); app.className="play";
  app.innerHTML=hud()+`<div class="tray" id="tray"><span class="s" id="ta">?</span> + <span class="s" id="tb">?</span> = ${T}</div>
    <div class="sky" id="sky"><div class="cloud" style="width:110px;height:34px;left:8%;top:12%"></div><div class="cloud" style="width:80px;height:26px;left:62%;top:30%"></div><div class="cloud" style="width:130px;height:38px;left:30%;top:62%"></div></div>`;
  G={mode:"bal",level:T,score:0,hearts:3,combo:0,hits:0,running:false,balls:[],sel:null,id:0}; setHud();
  const sky=document.getElementById("sky");
  sky.addEventListener("pointerdown",e=>{ const el=e.target.closest(".bal"); if(el) tapBal(+el.dataset.id); });
  countdown(()=>{ G.running=true; runClock(); G.last=performance.now(); G.nextSpawn=0; raf=requestAnimationFrame(loop); });
}
function spawn(n){
  const sky=document.getElementById("sky"); if(!sky) return; const W=sky.clientWidth, H=sky.clientHeight, w=Math.min(72,Math.max(58,W/6));
  const lanes=Math.max(3,Math.floor((W-10)/(w+6))); let lane, tries=0;
  do{ lane=rnd(0,lanes-1); tries++; } while(tries<8 && G.balls.some(b=>b.lane===lane && b.y>H-140));
  const b={id:++G.id,n,lane,x:6+lane*((W-w-12)/Math.max(1,lanes-1)),y:H+10,vy:rnd(38,58)+Math.min(40,G.hits*2.2),ph:Math.random()*6,w,col:pick(BCOL)};
  const el=document.createElement("div"); el.className="bal"; el.dataset.id=b.id; el.style.width=w+"px"; el.innerHTML=balloonSVG(n,b.col); sky.appendChild(el); b.el=el; G.balls.push(b);
}
function loop(t){
  if(!G.running) return; const dt=Math.min(.05,(t-G.last)/1000); G.last=t;
  if(!G.paused){
    G.nextSpawn-=dt;
    if(G.nextSpawn<=0 && G.balls.length<9){ const T=G.level, a=rnd(1,T-1); spawn(a); later(()=>{ if(G.running) spawn(T-a); },rnd(350,1100));
      if(Math.random()<.3) later(()=>{ if(G.running) spawn(rnd(1,T-1)); },rnd(500,1400)); G.nextSpawn=Math.max(1.3,2.3-G.hits*.06); }
    for(const b of G.balls){ if(b.popping) continue; b.y-=b.vy*dt; b.ph+=dt*2; const x=b.x+Math.sin(b.ph)*6;
      b.el.style.transform=`translate(${x}px,${b.y}px)`; b.el.style.setProperty("--t",`translate(${x}px,${b.y}px)`);
      if(b.y<-b.w*1.7){ if(G.sel===b.id) setSel(null); b.el.remove(); b.gone=true; } }
    G.balls=G.balls.filter(b=>!b.gone);
  }
  raf=requestAnimationFrame(loop);
}
function setSel(id){ G.balls.forEach(b=>b.el.classList.toggle("sel",b.id===id)); G.sel=id; const b=G.balls.find(x=>x.id===id);
  const ta=document.getElementById("ta"), tb=document.getElementById("tb"); ta.textContent=b?b.n:"?"; ta.classList.toggle("on",!!b); tb.textContent="?"; tb.classList.remove("on"); }
function tapBal(id){
  if(!G.running) return; const b=G.balls.find(x=>x.id===id); if(!b||b.popping) return;
  if(G.sel===null){ setSel(id); tone([520],"sine",.1,.15); return; }
  if(G.sel===id){ setSel(null); return; }
  const a=G.balls.find(x=>x.id===G.sel); const tb=document.getElementById("tb"); tb.textContent=b.n; tb.classList.add("on");
  if(a && a.n+b.n===G.level){ G.hits++; [a,b].forEach(burst); popSound(); later(SFX.good,60);
    const sky=document.getElementById("sky"); addPoints(b.x+b.w/2-14,b.y+10,sky); G.sel=null; later(()=>setSel(null),450); }
  else { SFX.bad(); [a,b].forEach(x=>{ if(!x) return; x.el.classList.add("shake"); later(()=>x.el.classList.remove("shake"),420); }); later(()=>setSel(null),420); loseHeart(); }
}
function burst(b){ b.popping=true; b.el.classList.remove("sel"); b.el.classList.add("pop"); const sky=document.getElementById("sky");
  const cx=b.x+b.w/2, cy=b.y+b.w*.5;
  for(let i=0;i<10;i++){ const p=document.createElement("div"); p.className="bit"; p.style.background=i%2?b.col:"#FFD23F"; p.style.left=cx+"px"; p.style.top=cy+"px";
    const ang=i/10*Math.PI*2; p.style.setProperty("--dx",Math.cos(ang)*rnd(40,70)+"px"); p.style.setProperty("--dy",Math.sin(ang)*rnd(40,70)+"px"); sky.appendChild(p); later(()=>p.remove(),650); }
  later(()=>{ b.el.remove(); b.gone=true; },260); }

/* ===== Mula ===== */
(function boot(){ const s=ls.get("ark-key"); if(s&&(KEYS.has(s)||(window.jmPass&&jmPass.valid(s)))) home(); else gate(); })();
</script>
